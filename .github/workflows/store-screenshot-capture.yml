name: Store Screenshot Capture

# CI-only deterministic evidence. No production auth/backend or Store upload.
on:
  workflow_dispatch:
    inputs:
      capture_plan_path:
        description: Capture plan JSON
        required: false
        type: string
        default: config/store/capture-plan.json

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate plan and prepare output
        env:
          CAPTURE_PLAN_PATH: ${{ inputs.capture_plan_path }}
        run: |
          set -euo pipefail
          test -f "$CAPTURE_PLAN_PATH"
          python3 - "$CAPTURE_PLAN_PATH" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected_devices = [
              {'slot': 'IPHONE', 'displayClass': '6.9',
               'simulator': 'iPhone 16 Pro Max', 'width': 1320, 'height': 2868},
              {'slot': 'IPAD', 'displayClass': '13',
               'simulator': 'iPad Pro 13-inch (M4)', 'width': 2064, 'height': 2752},
          ]
          expected_shots = {
              'iphone69-calendar-home': ['IPHONE'],
              'iphone69-voice-confirm': ['IPHONE'],
              'iphone69-group': ['IPHONE'],
              'ipad13-calendar': ['IPAD'],
              'ipad13-group': ['IPAD'],
          }
          assert plan.get('schemaVersion') == 1, 'unsupported schemaVersion'
          assert plan.get('platform') == 'ios', 'platform must be ios'
          assert plan.get('devices') == expected_devices, 'canonical device contract mismatch'
          shots = plan.get('shots', [])
          ids = [shot.get('screenshotId') for shot in shots]
          assert len(ids) == len(set(ids)) == 5, 'screenshot IDs must be five unique values'
          actual_shots = {shot['screenshotId']: shot.get('deviceSlots') for shot in shots}
          assert actual_shots == expected_shots, 'canonical 3 iPhone + 2 iPad mapping mismatch'
          PY
          mkdir -p "$RUNNER_TEMP/store-screenshots"
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Resolve Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get
      - name: Capture each device and shot
        env:
          CAPTURE_PLAN_PATH: ${{ inputs.capture_plan_path }}
          OUTPUT_DIR: ${{ runner.temp }}/store-screenshots
        run: |
          set -euo pipefail
          declare -a UDIDS=()
          cleanup() {
            for udid in "${UDIDS[@]}"; do
              xcrun simctl status_bar "$udid" clear || true
              xcrun simctl shutdown "$udid" || true
              xcrun simctl delete "$udid" || true
            done
          }
          trap cleanup EXIT
          manifest_devices="$RUNNER_TEMP/screenshot-devices.jsonl"
          : > "$manifest_devices"
          while IFS=$'\t' read -r slot simulator; do
            runtime_json="$(xcrun simctl list runtimes available -j | jq -ec '[.runtimes[] | select(.identifier | contains("iOS"))] | sort_by(.version | split(".") | map(tonumber)) | last')"
            runtime_id="$(jq -er '.identifier' <<< "$runtime_json")"
            runtime_name="$(jq -er '.name' <<< "$runtime_json")"
            runtime_version="$(jq -er '.version' <<< "$runtime_json")"
            type_matches="$(xcrun simctl list devicetypes -j | jq -c --arg n "$simulator" '[.devicetypes[] | select(.name==$n)]')"
            test "$(jq 'length' <<< "$type_matches")" -eq 1
            type_id="$(jq -er '.[0].identifier' <<< "$type_matches")"
            udid="$(xcrun simctl create "PlanFlow-$slot-${GITHUB_RUN_ID}" "$type_id" "$runtime_id")"
            test -n "$udid"
            UDIDS+=("$udid")
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --batteryState charged --wifiBars 3 --cellularBars 4
            xcrun simctl spawn "$udid" defaults write NSGlobalDomain AppleLanguages -array ko-KR en-US
            xcrun simctl spawn "$udid" defaults write NSGlobalDomain AppleLocale ko_KR
            while IFS=$'\t' read -r shot_id fixture; do
              allowed="$(jq -r --arg id "$shot_id" '.shots[] | select(.screenshotId==$id) | .deviceSlots[]' "$CAPTURE_PLAN_PATH" | grep -Fx "$slot" || true)"
              [[ "$allowed" == "$slot" ]] || continue
              OUTPUT_DIR="$OUTPUT_DIR" flutter drive --driver=test_driver/store_screenshot_driver.dart --target=integration_test/store_screenshot_capture_test.dart -d "$udid" --dart-define=STORE_SCREENSHOT_ID="$shot_id" --dart-define=E2E_MODE=1 --dart-define=SUPABASE_URL=https://fixture.invalid --dart-define=SUPABASE_ANON_KEY=fixture-only
              mv "$OUTPUT_DIR/$shot_id.png" "$OUTPUT_DIR/${shot_id}-${slot}.png"
            done < <(jq -r '.shots[] | [.screenshotId, .fixture] | @tsv' "$CAPTURE_PLAN_PATH")
            resolved_runtime="$(xcrun simctl list devices -j | jq -er --arg u "$udid" '.devices | to_entries[] | select(any(.value[]; .udid==$u)) | .key')"
            test "$resolved_runtime" = "$runtime_id"
            jq -cn --arg slot "$slot" --arg model "$simulator" --arg udid "$udid" \
              --arg runtime "$runtime_id" --arg runtimeName "$runtime_name" \
              --arg runtimeVersion "$runtime_version" \
              '{slot:$slot,model:$model,udid:$udid,runtimeIdentifier:$runtime,runtimeName:$runtimeName,runtimeVersion:$runtimeVersion}' \
              >> "$manifest_devices"
          done < <(jq -r '.devices[] | [.slot, .simulator] | @tsv' "$CAPTURE_PLAN_PATH")
          app_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          python3 - "$CAPTURE_PLAN_PATH" "$OUTPUT_DIR" "$manifest_devices" "$GITHUB_SHA" "$app_version" > "$OUTPUT_DIR/manifest.json" <<'PY'
          import hashlib, json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          output = pathlib.Path(sys.argv[2])
          devices = [json.loads(line) for line in pathlib.Path(sys.argv[3]).read_text().splitlines()]
          files = []
          for path in sorted(output.glob('*.png')):
              raw = path.read_bytes()
              width = int.from_bytes(raw[16:20], 'big')
              height = int.from_bytes(raw[20:24], 'big')
              shot_id, slot = path.stem.rsplit('-', 1)
              shot = next(s for s in plan['shots'] if s['screenshotId'] == shot_id)
              device = next(d for d in devices if d['slot'] == slot)
              files.append({'path': path.name, 'sha256': hashlib.sha256(raw).hexdigest(),
                            'width': width, 'height': height, 'slot': slot,
                            'screenshotId': shot_id, 'route': shot['route'],
                            'fixture': shot['fixture'], 'sourceLocator': shot['route'],
                            'finalLocator': path.name,
                            'locale': plan['determinism']['locale'],
                            'featureIds': shot['featureIds'],
                            'captureDeviceSlot': slot,
                            'captureDeviceModel': device['model'],
                            'captureDeviceUdid': device['udid'],
                            'captureRuntimeIdentifier': device['runtimeIdentifier'],
                            'captureOs': device['runtimeName'],
                            'captureOsVersion': device['runtimeVersion'],
                            'piiReview': 'PENDING',
                            'visualReview': 'PENDING',
                            'readinessEvidence': 'widget-key-and-screen-content'})
          print(json.dumps({'schemaVersion': 1, 'projectId': 'planflow', 'platform': 'ios',
                            'sourceSha': sys.argv[4], 'appVersion': sys.argv[5],
                            'buildProvenance': 'flutter-drive-canonical', 'captureType': 'native-simulator',
                            'devices': devices, 'files': files,
                            'qualification': 'PENDING', 'storeUpload': 'NOT_UPLOADED'},
                           ensure_ascii=False, indent=2))
          PY
      - name: Validate dimensions alpha PII tokens and duplicates
        env:
          CAPTURE_PLAN_PATH: ${{ inputs.capture_plan_path }}
          OUTPUT_DIR: ${{ runner.temp }}/store-screenshots
        run: python3 scripts/ios/validate_store_screenshots.py "$CAPTURE_PLAN_PATH" "$OUTPUT_DIR"
      - name: Upload capture artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planflow-store-screenshot-capture-${{ github.run_number }}
          path: ${{ runner.temp }}/store-screenshots
          if-no-files-found: error
          retention-days: 7
