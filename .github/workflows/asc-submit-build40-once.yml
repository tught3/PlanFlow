name: ASC submit Build40 once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Submit PlanFlow 1.0 with Build40
        shell: bash
        run: |
          python3 - <<'PY'
          import argparse, importlib.util, json, sys, time, urllib.error, urllib.parse, urllib.request

          ROOT="https://api.appstoreconnect.apple.com/v1"
          BUNDLE="com.fluxstudio.planflow"
          TARGET_VERSION="1.0"
          TARGET_BUILD="40"
          TARGET_TRAIN="1.1.1"

          spec=importlib.util.spec_from_file_location("asc","scripts/asc-next-build-number.py")
          asc=importlib.util.module_from_spec(spec); spec.loader.exec_module(asc)
          ns=argparse.Namespace(key_id=None,issuer_id=None,private_key_path=None,private_key_base64=None)
          kid,issuer,pem=asc.resolve_credentials(ns)
          token=asc.make_token(pem,kid,issuer)

          def req(method,path,body=None,params=None,ok=(200,201,204)):
              url=ROOT+path
              if params: url+="?"+urllib.parse.urlencode(params)
              data=None if body is None else json.dumps(body).encode()
              headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              if data is not None: headers["Content-Type"]="application/json"
              r=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=45) as resp:
                      status=resp.status; raw=resp.read()
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read()
              doc={}
              if raw:
                  try: doc=json.loads(raw)
                  except Exception: doc={"raw":raw.decode("utf-8","replace")[:600]}
              if status not in ok:
                  raise RuntimeError(f"ASC {method} {path} failed status={status} errors={(doc.get('errors') or [])[:3]}")
              return doc

          def rid(resource,name):
              d=((resource.get("relationships") or {}).get(name) or {}).get("data")
              return d.get("id") if isinstance(d,dict) else None

          apps=req("GET","/apps",params={"filter[bundleId]":BUNDLE,"limit":"10"}).get("data") or []
          if len(apps)!=1: raise RuntimeError(f"PlanFlow app count={len(apps)}")
          app_id=apps[0]["id"]

          vd=req("GET",f"/apps/{app_id}/appStoreVersions",params={
              "filter[versionString]":TARGET_VERSION,"filter[platform]":"IOS",
              "fields[appStoreVersions]":"platform,versionString,appStoreState,appVersionState,build",
              "include":"build","limit":"50"})
          versions=vd.get("data") or []
          if len(versions)!=1: raise RuntimeError(f"iOS version 1.0 count={len(versions)}")
          version=versions[0]; version_id=version["id"]
          state=(version.get("attributes") or {}).get("appVersionState") or (version.get("attributes") or {}).get("appStoreState")
          current_build_id=rid(version,"build")
          inc={x.get("id"):x for x in vd.get("included") or []}
          current_build=((inc.get(current_build_id) or {}).get("attributes") or {}).get("version") if current_build_id else None
          print(f"PRECHECK version=1.0 state={state} selectedBuild={current_build}")

          bd=req("GET","/builds",params={
              "filter[app]":app_id,"filter[version]":TARGET_BUILD,
              "fields[builds]":"version,processingState,preReleaseVersion",
              "include":"preReleaseVersion","fields[preReleaseVersions]":"version,platform","limit":"50"})
          builds=bd.get("data") or []
          if len(builds)!=1: raise RuntimeError(f"Build40 count={len(builds)}")
          build=builds[0]; build_id=build["id"]; ba=build.get("attributes") or {}
          binc={x.get("id"):x for x in bd.get("included") or []}
          train=((binc.get(rid(build,"preReleaseVersion")) or {}).get("attributes") or {}).get("version")
          if ba.get("processingState")!="VALID" or train!=TARGET_TRAIN:
              raise RuntimeError(f"Build40 invalid processing={ba.get('processingState')} train={train}")
          print(f"PRECHECK Build40 processing=VALID train={train}")

          if state in {"WAITING_FOR_REVIEW","IN_REVIEW"} and current_build_id==build_id:
              print(f"ALREADY_SUBMITTED state={state} selectedBuild=40"); sys.exit(0)
          if state not in {"DEVELOPER_REJECTED","PREPARE_FOR_SUBMISSION","READY_FOR_REVIEW"}:
              raise RuntimeError(f"Unexpected version state={state}")

          if current_build_id!=build_id:
              req("PATCH",f"/appStoreVersions/{version_id}/relationships/build",
                  {"data":{"type":"builds","id":build_id}},ok=(200,204))
              print("MUTATION selectedBuild=40")
          else:
              print("NOOP selectedBuild already 40")

          selected=req("GET",f"/appStoreVersions/{version_id}/build",
                       params={"fields[builds]":"version,processingState"}).get("data") or {}
          if selected.get("id")!=build_id or str((selected.get("attributes") or {}).get("version"))!="40":
              raise RuntimeError("Build40 relationship verification failed")
          print("VERIFY selectedBuild=40")

          sd=req("GET",f"/apps/{app_id}/reviewSubmissions",params={
              "fields[reviewSubmissions]":"platform,submittedDate,state,appStoreVersionForReview","limit":"50"})
          active=[s for s in (sd.get("data") or []) if (s.get("attributes") or {}).get("state") not in {"COMPLETE","CANCELING"}]
          review=None
          for s in active:
              items=req("GET",f"/reviewSubmissions/{s['id']}/items",params={
                  "fields[reviewSubmissionItems]":"state,appStoreVersion","include":"appStoreVersion","limit":"50"}).get("data") or []
              if any(rid(i,"appStoreVersion")==version_id for i in items):
                  review=s
                  st=(s.get("attributes") or {}).get("state")
                  if st in {"WAITING_FOR_REVIEW","IN_REVIEW"}:
                      print(f"ALREADY_SUBMITTED reviewState={st} selectedBuild=40"); sys.exit(0)
                  break

          if review is None:
              if active:
                  raise RuntimeError("Unrelated active review submission exists; fail closed")
              review=req("POST","/reviewSubmissions",{"data":{
                  "type":"reviewSubmissions","attributes":{"platform":"IOS"},
                  "relationships":{"app":{"data":{"type":"apps","id":app_id}}}}})["data"]
              print(f"MUTATION reviewSubmissionCreated={review['id']}")

          review_id=review["id"]
          items=req("GET",f"/reviewSubmissions/{review_id}/items",params={
              "fields[reviewSubmissionItems]":"state,appStoreVersion","include":"appStoreVersion","limit":"50"}).get("data") or []
          if not any(rid(i,"appStoreVersion")==version_id for i in items):
              req("POST","/reviewSubmissionItems",{"data":{
                  "type":"reviewSubmissionItems",
                  "relationships":{
                      "reviewSubmission":{"data":{"type":"reviewSubmissions","id":review_id}},
                      "appStoreVersion":{"data":{"type":"appStoreVersions","id":version_id}}}}})
              print("MUTATION reviewItemAdded=AppStoreVersion1.0")

          rd=req("GET",f"/reviewSubmissions/{review_id}",params={
              "fields[reviewSubmissions]":"platform,submittedDate,state,appStoreVersionForReview"})
          review_state=(rd.get("data",{}).get("attributes") or {}).get("state")
          print(f"PRE_SUBMIT reviewState={review_state}")
          if review_state=="READY_FOR_REVIEW":
              req("PATCH",f"/reviewSubmissions/{review_id}",{"data":{
                  "type":"reviewSubmissions","id":review_id,"attributes":{"submitted":True}}})
              print("MUTATION submitted=true")
          elif review_state not in {"WAITING_FOR_REVIEW","IN_REVIEW"}:
              raise RuntimeError(f"Unexpected review state={review_state}")

          final_review=None; final_version=None; final_build=None
          for _ in range(12):
              rr=req("GET",f"/reviewSubmissions/{review_id}",params={"fields[reviewSubmissions]":"state,submittedDate"})
              final_review=(rr.get("data",{}).get("attributes") or {}).get("state")
              vr=req("GET",f"/appStoreVersions/{version_id}",params={
                  "fields[appStoreVersions]":"platform,versionString,appStoreState,appVersionState,build",
                  "include":"build","fields[builds]":"version,processingState"})
              v=vr.get("data") or {}; a=v.get("attributes") or {}
              final_version=a.get("appVersionState") or a.get("appStoreState")
              vi={x.get("id"):x for x in vr.get("included") or []}
              final_build=((vi.get(rid(v,"build")) or {}).get("attributes") or {}).get("version")
              print(f"READBACK reviewState={final_review} versionState={final_version} selectedBuild={final_build}")
              if final_review in {"WAITING_FOR_REVIEW","IN_REVIEW"}: break
              time.sleep(5)

          if str(final_build)!="40" or final_review not in {"WAITING_FOR_REVIEW","IN_REVIEW"}:
              raise RuntimeError(f"Final verification failed review={final_review} version={final_version} build={final_build}")
          print(f"SUCCESS selectedBuild=40 reviewState={final_review} versionState={final_version}")
          PY
