name: iOS Simulator E2E (Simulator QA)

# PlanFlow iOS Simulator E2E. The simulator leg uses Flutter's official
# integration_test XCTest host. The old device runner was removed after the
# repeated Run #6 VM-service attach timeouts; each flow now exposes bounded
# build, install, launch, host-test, discovery, execution, and teardown data.
#
# FLOW1-4,6-8 use placeholder Supabase defines and never receive a production
# credential. FLOW5 Group A is a host-side flutter_test file and is also
# placeholder-only. Real-backend Group B is a separate post-release/manual
# concern and is not wired into this workflow.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'integration_test/**'
      - 'test/ios_e2e_flow05_fake_test.dart'
      - 'scripts/ios/**'
      - 'ios/Podfile'
      - 'ios/RunnerTests/**'
      - 'ios/Runner.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-simulator-e2e.yml'

permissions:
  contents: read

env:
  IOS_BUNDLE_ID: com.fluxstudio.planflow
  PROD_SUPABASE_REF: xqvvfnvmytjlblcngipn
  E2E_SUPABASE_URL_PLACEHOLDER: https://your-project.supabase.co
  E2E_SUPABASE_ANON_KEY_PLACEHOLDER: your-supabase-anon-key
  E2E_WATCHDOG_HEARTBEAT_INTERVAL: 30

jobs:
  preflight:
    # Simulator E2E is pinned to the macOS 15 image/Xcode 16 generation.
    # Xcode 26 on macos-latest cannot link this app's vendored Swift pods
    # because its removed compatibility libraries are still required by them.
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      flow5_exists: ${{ steps.flow5.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate E2E contracts and simulator discovery helpers
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/tests/e2e_script_contract.sh
          bash scripts/ios/tests/e2e_stage_markers_contract.sh
          bash scripts/ios/tests/simctl_discover_contract.sh
          bash scripts/ios/tests/e2e_xctest_runner_contract.sh
          bash scripts/ios/tests/e2e_admob_contract.sh

      - name: Verify backend isolation (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          workflow_file=".github/workflows/ios-simulator-e2e.yml"
          occurrences="$(grep -c "$PROD_SUPABASE_REF" "$workflow_file" || true)"
          if [[ "$occurrences" -gt 1 ]]; then
            echo "::error title=BLOCKED_E2E_BACKEND_ISOLATION::Production Supabase ref appears more than once in the E2E workflow."
            exit 1
          fi
          echo "E2E_BACKEND_ISOLATION_PASS: simulator and host FLOW5 paths are placeholder-only"

      - name: Discover simulator matrix
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          matrix_json="$(bash scripts/ios/simctl_discover.sh)"
          [[ "$matrix_json" != "[]" ]] || {
            echo "::error title=BLOCKED_NO_SIMULATOR_RUNTIME::No supported simulator was discovered."
            exit 1
          }
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "SIMULATOR_MATRIX_DISCOVERY_PASS: $(echo "$matrix_json" | jq -c 'map(.category)')"

      - name: Check host FLOW5 fixture
        id: flow5
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f test/ios_e2e_flow05_fake_test.dart ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::error title=BLOCKED_FLOW5_HOST_FIXTURE::Host-side fake FLOW5 test is missing."
            exit 1
          fi

  flow05-host-fake:
    needs: preflight
    if: ${{ needs.preflight.outputs.flow5_exists == 'true' }}
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Prepare Flutter dependencies (bounded)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flow05-host"
          E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/flow05-host/pub-get.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/flow05-host/pub-get.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 300 flutter pub get

      - name: Run FLOW5 Group A host fake test (bounded, zero backend)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flow05-host"
          set +e
          E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/flow05-host/flow05.log" \
            bash scripts/ios/e2e_watchdog.sh 300 \
              flutter test --no-pub test/ios_e2e_flow05_fake_test.dart \
              --dart-define=E2E_MODE=1 \
              --dart-define=E2E_REAL_BACKEND_TEST=0 \
              --dart-define=SUPABASE_URL="$E2E_SUPABASE_URL_PLACEHOLDER" \
              --dart-define=SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY_PLACEHOLDER"
          status=$?
          set -e
          echo "FLOW5_HOST_FAKE status=$status"
          [[ "$status" -eq 0 ]] || exit "$status"

      - name: Upload FLOW5 host evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planflow-ios-simulator-e2e-flow05-host-${{ github.run_number }}
          path: ${{ runner.temp }}/flow05-host
          if-no-files-found: ignore
          retention-days: 14

  simulator-e2e:
    needs: preflight
    if: ${{ needs.preflight.outputs.matrix != '' && needs.preflight.outputs.matrix != '[]' }}
    runs-on: macos-15
    # A clean Xcode APP_BUILD can exceed the former 600s stage bound without
    # emitting a compile/link error. Keep the per-stage bound below the
    # matrix job's 45-minute hard limit while allowing bounded build variance.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Prepare Flutter and CocoaPods (bounded)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/e2e-artifacts/pub-get.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/e2e-artifacts/pub-get.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 300 flutter pub get
          E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/e2e-artifacts/pod-install.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/e2e-artifacts/pod-install.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 300 pod install --project-directory=ios

      - name: Create and boot ${{ matrix.category }} simulator (${{ matrix.name }})
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          device_name="PlanFlow-E2E-${{ matrix.category }}-${{ github.run_id }}"
          udid_file="$RUNNER_TEMP/e2e-artifacts/simulator-udid"
          set +e
          E2E_DEVICE_NAME="$device_name" \
            E2E_DEVICE_TYPE="${{ matrix.devicetype_id }}" \
            E2E_RUNTIME_ID="${{ matrix.runtime_id }}" \
            E2E_UDID_FILE="$udid_file" \
            E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/e2e-artifacts/simulator-setup.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/e2e-artifacts/simulator-setup.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 180 bash -c '
              set -euo pipefail
              created_udid="$(xcrun simctl create "$E2E_DEVICE_NAME" "$E2E_DEVICE_TYPE" "$E2E_RUNTIME_ID")"
              printf "%s" "$created_udid" > "$E2E_UDID_FILE"
              xcrun simctl boot "$created_udid"
              xcrun simctl bootstatus "$created_udid" -b
            '
          status=$?
          set -e
          udid="$(cat "$udid_file" 2>/dev/null || true)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 || -z "$udid" ]]; then
            echo "::error title=BLOCKED_SIMULATOR_BOOT::Simulator create/boot watchdog exit=$status"
            exit "${status:-1}"
          fi
          echo "E2E_STAGE stage=SIMULATOR_BOOT status=PASS evidence=simulator-setup.log"

      - name: Grant baseline simulator privacy permissions
        shell: bash
        run: |
          set -euo pipefail
          E2E_UDID="${{ steps.boot.outputs.udid }}" \
            E2E_BUNDLE_ID="$IOS_BUNDLE_ID" \
            E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/e2e-artifacts/privacy-setup.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/e2e-artifacts/privacy-setup.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 120 bash -c '
              set -euo pipefail
              for service in microphone photos location; do
                bash scripts/ios/simctl_privacy.sh grant "$service" "$E2E_UDID" "$E2E_BUNDLE_ID"
              done
            '
          echo "E2E_STAGE stage=PRIVACY_SETUP status=PASS evidence=privacy-setup.log"

      - name: Run flow through bounded XCTest stages
        id: run_tests
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/e2e-artifacts"
          mkdir -p "$artifact_dir"
          case "${{ matrix.category }}" in
            mainstream)
              flow_files=(
                integration_test/flow01_cold_start_test.dart
                integration_test/flow02_schedule_crud_test.dart
                integration_test/flow03_navigation_routing_test.dart
                integration_test/flow04_notifications_test.dart
                integration_test/flow06_voice_permissions_test.dart
                integration_test/flow07_widget_appgroup_test.dart
                integration_test/flow08_resilience_a11y_test.dart
              )
              ;;
            small|large|ipad)
              flow_files=(integration_test/flow08_resilience_a11y_test.dart)
              ;;
            *)
              echo "::error title=BLOCKED_UNKNOWN_DEVICE_CATEGORY::Unknown category '${{ matrix.category }}'"
              exit 1
              ;;
          esac
          printf 'FLOW_FILES %s\n' "${flow_files[*]}"
          overall_status=0
          for flow_file in "${flow_files[@]}"; do
            flow_name="$(basename "$flow_file" .dart)"
            flow_artifact="$artifact_dir/$flow_name"
            flow_derived="$RUNNER_TEMP/e2e-derived/$flow_name"
            flow_result="$flow_artifact/$flow_name.xcresult"
            mkdir -p "$flow_artifact"
            set +e
            bash scripts/ios/e2e_xctest_flow.sh \
              "$flow_file" \
              "${{ steps.boot.outputs.udid }}" \
              "$IOS_BUNDLE_ID" \
              "$flow_derived" \
              "$flow_result" \
              "$flow_artifact" \
              900
            flow_status=$?
            set -e
            combined_log="$flow_artifact/e2e-combined.log"
            : > "$combined_log"
            while IFS= read -r log_file; do
              printf '\n--- %s ---\n' "$log_file" >> "$combined_log"
              cat "$log_file" >> "$combined_log"
            done < <(find "$flow_artifact/stages" -type f -name '*.log' -print | sort)
            if [[ -s "$combined_log" ]]; then
              source scripts/ios/e2e_mask_secrets.sh
              mask_secrets < "$combined_log" > "$combined_log.masked"
              mv "$combined_log.masked" "$combined_log"
            fi
            bash scripts/ios/e2e_summarize.sh \
              "${{ matrix.category }}" \
              "$combined_log" \
              "$flow_artifact/failure-summary.md" \
              "$flow_file" || true
            echo "FLOW_RESULT flow=$flow_name status=$flow_status category=${{ matrix.category }}"
            if [[ "$flow_status" -ne 0 ]]; then
              overall_status=1
            fi
          done
          echo "overall_status=$overall_status" >> "$GITHUB_OUTPUT"
          [[ "$overall_status" -eq 0 ]] || exit "$overall_status"

      - name: Exercise mainstream OS permission and deep-link checks
        if: ${{ success() && matrix.category == 'mainstream' }}
        shell: bash
        run: |
          set -euo pipefail
          E2E_UDID="${{ steps.boot.outputs.udid }}" \
            E2E_BUNDLE_ID="$IOS_BUNDLE_ID" \
            E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/e2e-artifacts/deeplink-check.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/e2e-artifacts/deeplink-check.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 120 bash -c '
              set -euo pipefail
              bash scripts/ios/simctl_privacy.sh revoke microphone "$E2E_UDID" "$E2E_BUNDLE_ID"
              bash scripts/ios/simctl_privacy.sh grant microphone "$E2E_UDID" "$E2E_BUNDLE_ID"
              bash scripts/ios/simctl_deeplink_relaunch.sh "$E2E_UDID" "$E2E_BUNDLE_ID"
            '
          echo "E2E_STAGE stage=DEEPLINK_CHECK status=PASS evidence=deeplink-check.log"

      - name: Capture simulator diagnostics on failure
        if: ${{ always() && steps.boot.outputs.udid != '' && steps.run_tests.outcome != 'success' }}
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          bash scripts/ios/e2e_diagnose_hang.sh \
            "${{ steps.boot.outputs.udid }}" \
            "$RUNNER_TEMP/e2e-artifacts/hang-diagnostics-${{ matrix.category }}"

      - name: Shutdown and delete simulator
        if: ${{ always() && steps.boot.outputs.udid != '' }}
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          E2E_UDID="${{ steps.boot.outputs.udid }}" \
            E2E_WATCHDOG_LOG_FILE="$RUNNER_TEMP/e2e-artifacts/teardown.log" \
            E2E_WATCHDOG_TAIL_FILE="$RUNNER_TEMP/e2e-artifacts/teardown.tail.log" \
            bash scripts/ios/e2e_watchdog.sh 120 bash -c '
              shutdown_status=0
              delete_status=0
              xcrun simctl shutdown "$E2E_UDID" >/dev/null 2>&1 || shutdown_status=$?
              xcrun simctl delete "$E2E_UDID" >/dev/null 2>&1 || delete_status=$?
              if [[ "$delete_status" -ne 0 ]]; then
                echo "simctl delete failed: shutdown_status=$shutdown_status delete_status=$delete_status" >&2
                exit "$delete_status"
              fi
              if [[ "$shutdown_status" -ne 0 ]]; then
                echo "simulator was already stopped or shutdown returned $shutdown_status; delete completed" >&2
              fi
              exit 0
            '
          status=$?
          echo "E2E_STAGE stage=TEARDOWN status=$([[ "$status" -eq 0 ]] && echo PASS || echo FAIL) exit=$status"
          if [[ "$status" -ne 0 ]]; then
            echo "::error title=BLOCKED_SIMULATOR_TEARDOWN::Simulator cleanup failed with watchdog exit=$status"
            exit "$status"
          fi

      - name: Upload XCTest and stage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planflow-ios-simulator-e2e-${{ matrix.category }}-${{ github.run_number }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
