name: iOS App Review submit

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: Exact App Store marketing version to submit (X.Y.Z).
        type: string
        required: true
      build_number:
        description: Exact valid App Store Connect build number to attach.
        type: string
        required: true
      dry_run:
        description: Resolve and validate everything without mutating App Store Connect.
        type: boolean
        required: true
        default: true
      confirm:
        description: For a real submission enter SUBMIT_PLANFLOW_IOS_REVIEW.
        type: string
        required: false
        default: ''
      replace_existing_build:
        description: Opt-in old build number of the active review submission to replace.
        type: string
        required: false
        default: ''
      confirm_replace:
        description: For a real replacement cancel enter REPLACE_PLANFLOW_IOS_REVIEW; otherwise verification-only.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: planflow-ios-app-store-connect
  cancel-in-progress: false

jobs:
  submit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_ID: com.fluxstudio.planflow
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      INPUT_APP_STORE_VERSION: ${{ inputs.app_store_version }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
      INPUT_REPLACE_EXISTING_BUILD: ${{ inputs.replace_existing_build }}
      INPUT_CONFIRM_REPLACE: ${{ inputs.confirm_replace }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit request and submit selected version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_APP_STORE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=BLOCKED_INPUT::app_store_version must be an explicit X.Y.Z value."
            exit 1
          fi
          if [[ ! "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error title=BLOCKED_INPUT::build_number must be explicit digits without a leading zero."
            exit 1
          fi
          if [[ "$INPUT_DRY_RUN" != "true" && "$INPUT_DRY_RUN" != "false" ]]; then
            echo "::error title=BLOCKED_DRY_RUN_AMBIGUOUS::dry_run must be an explicit boolean."
            exit 1
          fi
          if [[ "$INPUT_DRY_RUN" == "false" && "$INPUT_CONFIRM" != "SUBMIT_PLANFLOW_IOS_REVIEW" ]]; then
            echo "::error title=BLOCKED_CONFIRMATION::Live manual submission requires SUBMIT_PLANFLOW_IOS_REVIEW."
            exit 1
          fi
          args=(--bundle-id "$BUNDLE_ID" --version "$INPUT_APP_STORE_VERSION" --build "$INPUT_BUILD_NUMBER" --whats-new-file config/store/ios-release-notes.json --marketing-url https://fluxstudio.co.kr)
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$INPUT_REPLACE_EXISTING_BUILD" ]]; then
            if [[ ! "$INPUT_REPLACE_EXISTING_BUILD" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error title=BLOCKED_INPUT::replace_existing_build must be explicit digits without a leading zero."
              exit 1
            fi
            if [[ -n "$INPUT_CONFIRM_REPLACE" && "$INPUT_CONFIRM_REPLACE" != "REPLACE_PLANFLOW_IOS_REVIEW" ]]; then
              echo "::error title=BLOCKED_CONFIRMATION::Live replacement cancel requires REPLACE_PLANFLOW_IOS_REVIEW."
              exit 1
            fi
            args+=(--replace-existing-build "$INPUT_REPLACE_EXISTING_BUILD")
            if [[ "$INPUT_CONFIRM_REPLACE" == "REPLACE_PLANFLOW_IOS_REVIEW" ]]; then
              args+=(--confirm-replace "REPLACE_PLANFLOW_IOS_REVIEW")
            fi
          elif [[ -n "$INPUT_CONFIRM_REPLACE" ]]; then
            echo "::error title=BLOCKED_INPUT::confirm_replace requires replace_existing_build."
            exit 1
          fi
          python3 scripts/asc-submit-review.py "${args[@]}"
