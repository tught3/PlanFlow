name: iOS App Review submit

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: Existing App Store marketing version to resubmit.
        type: string
        required: true
        default: '1.0'
      build_train:
        description: TestFlight marketing version that contains the review build.
        type: string
        required: true
        default: '1.1.1'
      build_number:
        description: Existing valid TestFlight build number to attach.
        type: string
        required: true
        default: '40'
      dry_run:
        description: Resolve and validate everything without mutating App Store Connect.
        type: boolean
        required: true
        default: true
      confirm:
        description: For a real submission enter SUBMIT_PLANFLOW_IOS_REVIEW.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  submit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: com.fluxstudio.planflow
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      INPUT_APP_STORE_VERSION: ${{ inputs.app_store_version }}
      INPUT_BUILD_TRAIN: ${{ inputs.build_train }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and submit existing version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import argparse
          import importlib.util
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          API_ROOT = "https://api.appstoreconnect.apple.com/v1"
          bundle_id = os.environ["BUNDLE_ID"].strip()
          app_store_version = os.environ["INPUT_APP_STORE_VERSION"].strip()
          build_train = os.environ["INPUT_BUILD_TRAIN"].strip()
          build_number = os.environ["INPUT_BUILD_NUMBER"].strip()
          dry_run = os.environ["INPUT_DRY_RUN"].lower() == "true"
          confirm = os.environ.get("INPUT_CONFIRM", "").strip()

          if not app_store_version or not build_train or not build_number.isdigit():
              raise SystemExit("BLOCKED_INPUT: invalid version/build input")
          if not dry_run and confirm != "SUBMIT_PLANFLOW_IOS_REVIEW":
              raise SystemExit("BLOCKED_CONFIRMATION: real review submission requires SUBMIT_PLANFLOW_IOS_REVIEW")

          spec = importlib.util.spec_from_file_location(
              "asc_helpers", "scripts/asc-next-build-number.py"
          )
          helpers = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(helpers)

          args = argparse.Namespace(
              key_id=None,
              issuer_id=None,
              private_key_path=None,
              private_key_base64=None,
          )
          key_id, issuer_id, private_key_pem = helpers.resolve_credentials(args)
          token = helpers.make_token(private_key_pem, key_id, issuer_id)

          def api(method: str, path: str, body=None, *, allow_error=False):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              }
              if body is not None:
                  data = json.dumps(body, separators=(",", ":")).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  API_ROOT + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", "replace")
                  try:
                      document = json.loads(raw)
                  except json.JSONDecodeError:
                      document = {
                          "errors": [
                              {
                                  "status": str(error.code),
                                  "detail": "non-json response",
                              }
                          ]
                      }
                  if allow_error:
                      return error.code, document
                  summary = helpers.error_summary(document)
                  raise SystemExit(
                      f"ASC_API_ERROR {method} {path}: HTTP {error.code}: {summary}"
                  )

          app_id = helpers.resolve_app_id(token, bundle_id)

          q = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[platform]": "IOS",
                  "fields[appStoreVersions]": "versionString,appStoreState,build,platform",
                  "include": "build",
                  "limit": "200",
              }
          )
          _, versions_doc = api("GET", f"/appStoreVersions?{q}")
          versions = [
              item
              for item in versions_doc.get("data", [])
              if (item.get("attributes") or {}).get("versionString")
              == app_store_version
          ]
          if len(versions) != 1:
              raise SystemExit(
                  f"BLOCKED_VERSION: expected exactly one iOS App Store version {app_store_version}, found {len(versions)}"
              )
          version = versions[0]
          version_id = version["id"]
          version_state = (version.get("attributes") or {}).get("appStoreState")
          allowed_states = {
              "DEVELOPER_REJECTED",
              "PREPARE_FOR_SUBMISSION",
              "REJECTED",
          }
          if version_state not in allowed_states:
              raise SystemExit(
                  f"BLOCKED_VERSION_STATE: version {app_store_version} state={version_state}; expected one of {sorted(allowed_states)}"
              )

          q = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[version]": build_number,
                  "fields[builds]": "version,processingState,preReleaseVersion",
                  "fields[preReleaseVersions]": "version",
                  "include": "preReleaseVersion",
                  "limit": "200",
              }
          )
          _, builds_doc = api("GET", f"/builds?{q}")
          included = {
              item["id"]: item
              for item in builds_doc.get("included", [])
              if item.get("type") == "preReleaseVersions" and item.get("id")
          }
          matching_builds = []
          for build in builds_doc.get("data", []):
              if str((build.get("attributes") or {}).get("version")) != build_number:
                  continue
              pre_id = (
                  ((build.get("relationships") or {}).get("preReleaseVersion") or {}).get("data")
                  or {}
              ).get("id")
              train = ((included.get(pre_id) or {}).get("attributes") or {}).get(
                  "version"
              )
              if train == build_train:
                  matching_builds.append(build)
          if len(matching_builds) != 1:
              raise SystemExit(
                  f"BLOCKED_BUILD: expected exactly one build {build_train} ({build_number}), found {len(matching_builds)}"
              )
          build = matching_builds[0]
          build_id = build["id"]
          processing_state = (build.get("attributes") or {}).get("processingState")
          if processing_state != "VALID":
              raise SystemExit(
                  f"BLOCKED_BUILD_STATE: build {build_train} ({build_number}) processingState={processing_state}"
              )

          _, relationship_doc = api(
              "GET", f"/appStoreVersions/{version_id}/relationships/build"
          )
          current_build = relationship_doc.get("data") or {}
          current_build_id = current_build.get("id")

          _, review_detail_doc = api(
              "GET",
              f"/appStoreVersions/{version_id}/appStoreReviewDetail"
              "?fields[appStoreReviewDetails]=notes,demoAccountRequired",
          )
          review_detail = review_detail_doc.get("data") or {}
          review_detail_id = review_detail.get("id")
          if not review_detail_id:
              raise SystemExit(
                  "BLOCKED_REVIEW_DETAIL: App Store review detail is missing"
              )
          demo_required = (review_detail.get("attributes") or {}).get(
              "demoAccountRequired"
          )
          if demo_required is not True:
              raise SystemExit(
                  "BLOCKED_DEMO_ACCOUNT: review detail no longer requires the configured demo account"
              )

          notes = """PlanFlow resubmission - Build 40 (1.1.1)

          Previous review findings have been addressed:
          1. Sign in with Apple is available on iOS alongside Google, Kakao, and Naver sign-in.
          2. Permission denials are respected. The app does not automatically redirect users to Settings; Settings navigation requires an explicit user action.
          3. In the iOS location picker, the "Apple 지도에서 열기" action opens the selected place in Apple Maps.
          4. The app does not request ATT authorization and does not directly access IDFA. NSUserTrackingUsageDescription is absent. App Privacy tracking answers for Device ID and Advertising Data are set to No.
          5. PlanFlow includes its WidgetKit extension. To add a widget: long-press the Home Screen, tap +, search for PlanFlow, then add the desired widget.
          6. In TestFlight/App Review sandbox, the rewarded-ad flow uses Google's official test rewarded-ad unit. The production App Store runtime uses the configured production unit.

          Build 40 passed TestFlight ingestion and real-device rewarded-ad load/show/reward/return validation."""
          notes = "\n".join(line.strip() for line in notes.strip().splitlines())

          print(
              "READY "
              f"app={app_id} version={app_store_version} versionState={version_state} "
              f"selectedBuild={'none' if not current_build_id else current_build_id} "
              f"targetBuild={build_train}({build_number}) processingState={processing_state} "
              f"dryRun={dry_run}"
          )

          if dry_run:
              print("DRY_RUN=PASS")
              raise SystemExit(0)

          if current_build_id != build_id:
              api(
                  "PATCH",
                  f"/appStoreVersions/{version_id}/relationships/build",
                  {"data": {"type": "builds", "id": build_id}},
              )
              print(f"BUILD_RELATIONSHIP_UPDATED={build_number}")
          else:
              print(f"BUILD_RELATIONSHIP_ALREADY={build_number}")

          api(
              "PATCH",
              f"/appStoreReviewDetails/{review_detail_id}",
              {
                  "data": {
                      "type": "appStoreReviewDetails",
                      "id": review_detail_id,
                      "attributes": {"notes": notes},
                  }
              },
          )
          print("REVIEW_NOTES_UPDATED=PASS")

          legacy_body = {
              "data": {
                  "type": "appStoreVersionSubmissions",
                  "relationships": {
                      "appStoreVersion": {
                          "data": {
                              "type": "appStoreVersions",
                              "id": version_id,
                          }
                      }
                  },
              }
          }
          status, submit_doc = api(
              "POST",
              "/appStoreVersionSubmissions",
              legacy_body,
              allow_error=True,
          )
          if status not in (200, 201):
              summary = helpers.error_summary(submit_doc)
              raise SystemExit(f"SUBMIT_FAILED: HTTP {status}: {summary}")
          print("APP_STORE_VERSION_SUBMISSION=CREATED")

          terminal_ok = {
              "WAITING_FOR_REVIEW",
              "IN_REVIEW",
              "PENDING_DEVELOPER_RELEASE",
              "PENDING_APPLE_RELEASE",
          }
          observed = version_state
          for _ in range(8):
              time.sleep(5)
              _, doc = api(
                  "GET",
                  f"/appStoreVersions/{version_id}"
                  "?fields[appStoreVersions]=versionString,appStoreState,build",
              )
              observed = (
                  ((doc.get("data") or {}).get("attributes") or {}).get(
                      "appStoreState"
                  )
              )
              if observed in terminal_ok:
                  break
          if observed not in terminal_ok:
              raise SystemExit(
                  f"SUBMIT_UNCONFIRMED: submission resource was created but version state={observed}"
              )
          print(f"SUBMIT_RESULT=PASS state={observed} build={build_number}")
          PY
