name: iOS 27 portrait widget validation once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      FIREBASE_PLIST_BASE64: ${{ secrets.PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      NAVER_MAP_CLIENT_ID: ${{ secrets.PLANFLOW_NAVER_MAP_CLIENT_ID }}
      NAVER_MAP_PROXY_URL: ${{ secrets.PLANFLOW_NAVER_MAP_PROXY_URL }}
      TMAP_API_KEY: ${{ secrets.PLANFLOW_TMAP_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.PLANFLOW_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter and WidgetKit contract tests
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --no-pub test/ios_widget_version_contract_test.dart

      - name: Compile unsigned iOS app and WidgetKit extension
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f ios/Runner/GoogleService-Info.plist' EXIT
          pod install --project-directory=ios
          umask 077
          printf '%s' "$FIREBASE_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          bash scripts/verify-ios-firebase-config.sh
          flutter build ios --release --no-codesign \
            --build-name 1.1.1 --build-number 990 \
            --dart-define=NAVER_MAP_CLIENT_ID="$NAVER_MAP_CLIENT_ID" \
            --dart-define=NAVER_MAP_PROXY_URL="$NAVER_MAP_PROXY_URL" \
            --dart-define=TMAP_API_KEY="$TMAP_API_KEY" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
          test -d build/ios/iphoneos/Runner.app/PlugIns/PlanFlowWidgetExtension.appex
          rm -f ios/Runner/GoogleService-Info.plist
          trap - EXIT
