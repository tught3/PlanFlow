name: iOS historical Runner symbol reconstruction (audit-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-historical-symbol-reconstruction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Build ${{ matrix.build }} historical Runner symbols
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: 16
            commit: 503bba99ec5efe37195b2a516c0f923c9fd8b4c6
            version: 1.0.0
            uuid: 96EB03A3-C4E7-3C3E-9C58-9E3F6DE896BC
            offset_a: 7717012
            offset_b: 7717392
          - build: 17
            commit: f5cd355e0aa78eeb575326cee2822e6bbb528805
            version: 1.0.0
            uuid: D9B552C8-3F13-3217-B8B9-6886EE0926D0
            offset_a: 7717068
            offset_b: 7717448
    steps:
      - name: Checkout trusted dispatched main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted ref and checkout source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git -C tooling rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Checkout exact historical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact historical source SHA
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "${{ matrix.commit }}"

      - name: Install fixed Flutter toolchain
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          cache: false

      - name: Prepare canonical protected Firebase input
        shell: bash
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PLIST_BASE64:-}"
          firebase_plist="$RUNNER_TEMP/planflow-historical-firebase.plist"
          umask 077
          printf '%s' "$FIREBASE_PLIST_BASE64" | base64 -D > "$firebase_plist"
          echo "HISTORICAL_FIREBASE_PLIST=$firebase_plist" >> "$GITHUB_ENV"

      - name: Reconstruct and symbolicate two fixed historical frames
        shell: bash
        continue-on-error: true
        run: |
          set +e
          umask 077
          mkdir -p tooling/reports
          bash tooling/scripts/ios/reconstruct_historical_runner_symbols.sh \
            "$GITHUB_WORKSPACE/source" \
            "$GITHUB_WORKSPACE/tooling/reports/build-${{ matrix.build }}.json" \
            "${{ matrix.build }}" "${{ matrix.version }}" "${{ matrix.uuid }}" \
            "${{ matrix.offset_a }}" "${{ matrix.offset_b }}" \
            "$HISTORICAL_FIREBASE_PLIST"
          rc=$?
          printf '%s\n' "$rc" > "tooling/reports/build-${{ matrix.build }}.status"
          exit 0

      - name: Delete protected reconstruction input
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "${HISTORICAL_FIREBASE_PLIST:-$RUNNER_TEMP/planflow-historical-firebase.plist}"

      - name: Emit one bounded public annotation
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "tooling/reports/build-${{ matrix.build }}.json" "${{ matrix.build }}" <<'PY'
          import json, sys
          path, build = sys.argv[1:]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception:
              data = {"status": "NO_RESULT", "reason": "REPORT_UNAVAILABLE", "actual_executable_uuid": "", "actual_dsym_uuid": "", "variants": {}}
          def command_escape(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          if data.get("status") == "PASS":
              frames = data.get("frames", [])[:2]
              bounded = "; ".join(f"{x.get('function','')[:100]} [{x.get('file') or 'unknown'}:{x.get('line') or '?'}]" for x in frames)
              variant = str(data.get("selected_variant") or "unknown")[:32]
              print(f"::notice title=HISTORICAL_SYMBOLICATION_PASS_BUILD_{build}::{command_escape(f'variant={variant} {bounded[:460]}')}")
          else:
              variants = data.get("variants") if isinstance(data.get("variants"), dict) else {}
              states = ",".join(f"{k}:{str(v.get('status','UNKNOWN'))[:40]}" for k, v in sorted(variants.items()) if isinstance(v, dict))
              message = f"reason={data.get('reason','UNKNOWN')[:80]} variants={states[:140]} executable_uuid={data.get('actual_executable_uuid','')[:36]} dsym_uuid={data.get('actual_dsym_uuid','')[:36]}"
              print(f"::warning title=HISTORICAL_SYMBOLICATION_NO_RESULT_BUILD_{build}::{command_escape(message)}")
          PY

      - name: Upload sanitized report only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: planflow-historical-symbol-report-build-${{ matrix.build }}
          path: tooling/reports/build-${{ matrix.build }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail matrix result on no-result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "tooling/reports/build-${{ matrix.build }}.status"
          test "$(cat "tooling/reports/build-${{ matrix.build }}.status")" = 0
