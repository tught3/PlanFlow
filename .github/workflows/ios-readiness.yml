name: iOS readiness (macOS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - 'docs/ios/**'
      - '.github/workflows/ios-readiness.yml'

permissions:
  contents: read

jobs:
  analyze-and-ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - name: Verify native iOS target contract
        shell: bash
        run: |
          test -f ios/Runner.xcodeproj/project.pbxproj || {
            echo "::error::iOS Xcode target is not committed or cannot be validated on this runner.";
            exit 1;
          }
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata || {
            echo "::error::iOS workspace is missing. Run CocoaPods/Flutter target setup on macOS.";
            exit 1;
          }
          test -f ios/Podfile || {
            echo "::error::CLOUD_MACOS_REQUIRED: Podfile is missing; create it on macOS before CocoaPods/build.";
            exit 1;
          }
          test -f ios/PlanFlowWidget/PlanFlowWidget.swift || {
            echo "::error::WidgetKit source is missing.";
            exit 1;
          }
          grep -q 'PlanFlowWidgetExtension' ios/Runner.xcodeproj/project.pbxproj || {
            echo "::error::WIDGET_EXTENSION_TARGET_REQUIRED: WidgetKit target is not wired.";
            exit 1;
          }
          grep -q 'PLANFLOW_IOS_BUNDLE_ID' ios/Flutter/PlanFlow-Identity.xcconfig || {
            echo "::error::Canonical iOS identity config is missing.";
            exit 1;
          }
          grep -q 'PLANFLOW_IOS_BUNDLE_ID = com.fluxstudio.planflow' ios/Flutter/PlanFlow-Identity.xcconfig || {
            echo "::error::IOS_BUNDLE_ID_DRIFT: expected com.fluxstudio.planflow.";
            exit 1;
          }
          grep -q 'PLANFLOW_IOS_APP_GROUP = group.com.fluxstudio.planflow' ios/Flutter/PlanFlow-Identity.xcconfig || {
            echo "::error::APP_GROUP_DRIFT: expected group.com.fluxstudio.planflow.";
            exit 1;
          }
          grep -q 'PLANFLOW_IOS_APP_GROUP' ios/PlanFlowWidget/Info.plist || {
            echo "::error::Widget App Group config is missing.";
            exit 1;
          }
      - name: Inject Firebase iOS plist from protected secret
        env:
          PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::BLOCKED_FIREBASE_CONFIG: configure PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 repository secret."
            exit 12
          fi
          umask 077
          printf '%s' "$PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Verify Firebase iOS artifact
        run: |
          bash scripts/test-verify-ios-firebase-config.sh
          bash scripts/verify-ios-firebase-config.sh
      - name: Resolve CocoaPods dependencies
        run: pod install --project-directory=ios
      - run: flutter analyze
      - run: flutter test
      - name: Build Runner target (unsigned)
        run: >-
          xcodebuild -workspace ios/Runner.xcworkspace
          -scheme Runner
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
      - run: flutter build ios --no-codesign
      - name: Build WidgetKit extension target (unsigned)
        run: >-
          xcodebuild -project ios/Runner.xcodeproj
          -target PlanFlowWidgetExtension
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

  signed-release:
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - run: echo "Enable only after Apple signing and App Store Connect secrets are configured."
