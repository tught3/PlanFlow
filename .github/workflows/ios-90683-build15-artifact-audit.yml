name: iOS 90683 privacy audit (macOS, audit-only)

on:
  workflow_dispatch:
    inputs:
      audit_build_number:
        description: 'Existing build number represented by the preserved IPA.'
        required: true
        default: '15'
      audit_artifact_run_id:
        description: 'GitHub Actions run ID that owns the preserved signed IPA artifact.'
        required: true
      audit_artifact_name:
        description: 'Artifact containing exactly one IPA and provenance.json.'
        required: true
      audit_artifact_sha256:
        description: 'SHA-256 of the exact Build 15 IPA (lowercase hex).'
        required: true
      audit_source_commit:
        description: '40-character source commit recorded in provenance.json.'
        required: true

permissions:
  contents: read
  actions: read

# Audit-only. This workflow audits a preserved signed IPA; it never rebuilds,
# signs, uploads, or queries App Store Connect. Build 16 remains undispatched.
jobs:
  privacy-audit:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      IOS_BUNDLE_ID: com.fluxstudio.planflow
      IOS_AUDIT_BUILD_NUMBER: ${{ inputs.audit_build_number }}
      IOS_AUDIT_ARTIFACT_RUN_ID: ${{ inputs.audit_artifact_run_id }}
      IOS_AUDIT_ARTIFACT_NAME: ${{ inputs.audit_artifact_name }}
      IOS_AUDIT_ARTIFACT_SHA256: ${{ inputs.audit_artifact_sha256 }}
      IOS_AUDIT_SOURCE_COMMIT: ${{ inputs.audit_source_commit }}
    steps:
      - name: Validate immutable Build 15 audit inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${IOS_AUDIT_BUILD_NUMBER:-}" ]]; then
            echo "::error title=BLOCKED_AUDIT_BUILD_NUMBER::audit_build_number is required."
            exit 1
          fi
          if ! [[ "$IOS_AUDIT_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=BLOCKED_AUDIT_BUILD_NUMBER::audit_build_number must be a positive decimal integer without leading zeros."
            exit 1
          fi
          if [[ "$IOS_AUDIT_BUILD_NUMBER" != "15" ]]; then
            echo "::error title=BLOCKED_AUDIT_BUILD_NUMBER::this 90683 workflow audits Build 15 only."
            exit 1
          fi
          if ! [[ "$IOS_AUDIT_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=BLOCKED_AUDIT_ARTIFACT_RUN::artifact run ID must be a positive decimal integer."
            exit 1
          fi
          if ! [[ "$IOS_AUDIT_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=BLOCKED_AUDIT_ARTIFACT_NAME::artifact name contains unsupported characters."
            exit 1
          fi
          if ! [[ "$IOS_AUDIT_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=BLOCKED_AUDIT_ARTIFACT_HASH::exact IPA SHA-256 must be 64 lowercase hexadecimal characters."
            exit 1
          fi
          if ! [[ "$IOS_AUDIT_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=BLOCKED_AUDIT_SOURCE_COMMIT::source commit must be a full 40-character commit."
            exit 1
          fi
          echo "AUDIT_ONLY_NO_UPLOAD: PASS"
          echo "BUILD_16_DISPATCHED: NO"
          echo "REBUILD_PERFORMED: NO"

      - name: Checkout the recorded source commit for provenance verification
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.audit_source_commit }}
          fetch-depth: 1

      - name: Verify checked-out source provenance
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "${actual_commit,,}" != "${IOS_AUDIT_SOURCE_COMMIT,,}" ]]; then
            echo "::error title=BLOCKED_AUDIT_SOURCE_PROVENANCE::checked-out source commit does not match the requested Build 15 provenance."
            exit 1
          fi
          echo "AUDIT_SOURCE_COMMIT_VERIFIED: $actual_commit"

      - name: Download preserved signed IPA artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.audit_artifact_run_id }}
          name: ${{ inputs.audit_artifact_name }}
          path: ios-audit-input

      - name: Verify exact Build 15 artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ipa_candidates < <(find ios-audit-input -type f -name '*.ipa' -print | sort)
          mapfile -t provenance_candidates < <(find ios-audit-input -type f -name 'provenance.json' -print | sort)
          if (( ${#ipa_candidates[@]} != 1 )); then
            echo "::error title=BLOCKED_AUDIT_ARTIFACT::expected exactly one preserved IPA; found ${#ipa_candidates[@]}."
            exit 1
          fi
          if (( ${#provenance_candidates[@]} != 1 )); then
            echo "::error title=BLOCKED_AUDIT_PROVENANCE::expected exactly one provenance.json; found ${#provenance_candidates[@]}."
            exit 1
          fi
          ipa="${ipa_candidates[0]}"
          actual_sha256="$(shasum -a 256 "$ipa" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$IOS_AUDIT_ARTIFACT_SHA256" ]]; then
            echo "::error title=BLOCKED_AUDIT_ARTIFACT_HASH::preserved IPA SHA-256 does not match the supplied Build 15 hash."
            exit 1
          fi
          python3 - "$ipa" "${provenance_candidates[0]}" <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import sys
          import zipfile

          ipa_path, provenance_path = sys.argv[1:]
          with open(provenance_path, encoding="utf-8") as handle:
              provenance = json.load(handle)
          expected_build = os.environ["IOS_AUDIT_BUILD_NUMBER"]
          expected_commit = os.environ["IOS_AUDIT_SOURCE_COMMIT"].lower()
          expected_hash = os.environ["IOS_AUDIT_ARTIFACT_SHA256"]
          if str(provenance.get("buildNumber")) != expected_build:
              raise SystemExit("BLOCKED_AUDIT_PROVENANCE: buildNumber mismatch")
          if str(provenance.get("sourceCommit", "")).lower() != expected_commit:
              raise SystemExit("BLOCKED_AUDIT_PROVENANCE: sourceCommit mismatch")
          if str(provenance.get("bundleId", "")) != "com.fluxstudio.planflow":
              raise SystemExit("BLOCKED_AUDIT_PROVENANCE: bundleId mismatch")
          actual_hash = hashlib.sha256(open(ipa_path, "rb").read()).hexdigest()
          if str(provenance.get("ipaSha256", "")).lower() != actual_hash or actual_hash != expected_hash:
              raise SystemExit("BLOCKED_AUDIT_PROVENANCE: ipaSha256 mismatch")
          with zipfile.ZipFile(ipa_path) as archive:
              plist_names = [name for name in archive.namelist() if name.endswith("Payload/Runner.app/Info.plist")]
              if len(plist_names) != 1:
                  raise SystemExit("BLOCKED_AUDIT_METADATA: expected exactly one Runner Info.plist")
              plist = plistlib.loads(archive.read(plist_names[0]))
              widget_names = [name for name in archive.namelist() if name.endswith("Payload/Runner.app/PlugIns/PlanFlowWidgetExtension.appex/Info.plist")]
              if len(widget_names) != 1:
                  raise SystemExit("BLOCKED_AUDIT_METADATA: expected exactly one Widget Info.plist")
              widget_plist = plistlib.loads(archive.read(widget_names[0]))
          if str(plist.get("CFBundleIdentifier")) != "com.fluxstudio.planflow":
              raise SystemExit("BLOCKED_AUDIT_METADATA: bundle identifier mismatch")
          if str(plist.get("CFBundleVersion")) != expected_build:
              raise SystemExit("BLOCKED_AUDIT_METADATA: CFBundleVersion mismatch")
          widget_bundle_id = "com.fluxstudio.planflow.PlanFlowWidget"
          if str(widget_plist.get("CFBundleIdentifier")) != widget_bundle_id:
              raise SystemExit("BLOCKED_AUDIT_METADATA: widget bundle identifier mismatch")
          if str(widget_plist.get("CFBundleVersion")) != expected_build:
              raise SystemExit("BLOCKED_AUDIT_METADATA: widget CFBundleVersion mismatch")
          print("EXACT_BUILD15_ARTIFACT_PROVENANCE: PASS")
          PY
          echo "PLANFLOW_IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Extract preserved IPA for privacy audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios-audit-unpacked
          mkdir -p ios-audit-unpacked ios-audit
          unzip -q "$PLANFLOW_IPA_PATH" -d ios-audit-unpacked
          app="ios-audit-unpacked/Payload/Runner.app"
          widget="$app/PlugIns/PlanFlowWidgetExtension.appex"
          test -d "$app" || { echo "::error title=BLOCKED_AUDIT_METADATA::Runner.app missing."; exit 1; }
          test -d "$widget" || { echo "::error title=BLOCKED_WIDGET_ARCHIVE::Widget extension missing."; exit 1; }
          python3 scripts/verify-ios-privacy-surface.py \
            --runner-plist "$app/Info.plist" \
            --widget-plist "$widget/Info.plist" \
            --runner-bundle "$app" \
            --require-binary-scan \
            --audit-report \
            --report-json "$GITHUB_WORKSPACE/ios-audit/audit-export-privacy-report.json"
          echo "EXPORT_PRIVACY_AUDIT_CAPTURED: PASS"
          echo "APP_STORE_UPLOAD_PERFORMED: NO"

      - name: Preserve iOS 90683 audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planflow-ios-90683-audit-${{ github.run_number }}
          path: ios-audit/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup protected artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          rm -rf ios-audit-input ios-audit-unpacked
          echo "Secret cleanup gate executed."
