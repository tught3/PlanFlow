name: iOS signed release (TestFlight)

on:
  workflow_dispatch:

permissions:
  contents: read

# The unsigned macOS contract remains in ios-readiness.yml. This workflow is
# deliberately separate: a missing signing asset must fail, never downgrade
# to an unsigned artifact or report a successful release.
jobs:
  signed-release:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      IOS_BUNDLE_ID: com.fluxstudio.planflow
      IOS_WIDGET_BUNDLE_ID: com.fluxstudio.planflow.PlanFlowWidget
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_BUILD_NAME: 1.0.0
      APPLE_TEAM_ID: ${{ secrets.PLANFLOW_APPLE_TEAM_ID }}
      DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.PLANFLOW_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.PLANFLOW_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      RUNNER_PROFILE_BASE64: ${{ secrets.PLANFLOW_IOS_RUNNER_PROVISIONING_PROFILE_BASE64 }}
      WIDGET_PROFILE_BASE64: ${{ secrets.PLANFLOW_IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
      FIREBASE_PLIST_BASE64: ${{ secrets.PLANFLOW_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight protected release gates
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          # Team ID is derived from the signed Runner profile below. An optional
          # PLANFLOW_APPLE_TEAM_ID secret is still accepted and cross-checked.
          for name in DISTRIBUTION_CERTIFICATE_BASE64 DISTRIBUTION_CERTIFICATE_PASSWORD RUNNER_PROFILE_BASE64 WIDGET_PROFILE_BASE64 FIREBASE_PLIST_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error title=BLOCKED_APPLE_SIGNING::BLOCKED_APPLE_SIGNING: missing protected release secrets: ${missing[*]}"
            echo "Unsigned readiness remains available through ios-readiness.yml; no signed artifact was produced."
            exit 1
          fi
          if [[ "$IOS_BUNDLE_ID" != "com.fluxstudio.planflow" || "$IOS_WIDGET_BUNDLE_ID" != "com.fluxstudio.planflow.PlanFlowWidget" ]]; then
            echo "::error::BLOCKED_IOS_IDENTITY: canonical bundle IDs changed unexpectedly."
            exit 1
          fi
          echo "Release gates: Apple signing, Firebase config, and App Store Connect credentials are present."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Prepare Flutter and protected Firebase plist
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f ios/Runner/GoogleService-Info.plist' EXIT
          flutter pub get
          pod install --project-directory=ios
          umask 077
          printf '%s' "$FIREBASE_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          bash scripts/verify-ios-firebase-config.sh
          flutter build ios --release --no-codesign --build-name "$IOS_BUILD_NAME" --build-number "$IOS_BUILD_NUMBER"
          rm -f ios/Runner/GoogleService-Info.plist
          trap - EXIT

      - name: Install Apple signing assets without logging secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/planflow-signing.keychain-db"
          cert="$RUNNER_TEMP/planflow-distribution.p12"
          runner_profile="$RUNNER_TEMP/planflow-runner.mobileprovision"
          widget_profile="$RUNNER_TEMP/planflow-widget.mobileprovision"
          import_log="$RUNNER_TEMP/planflow-security-import.log"
          identities_log="$RUNNER_TEMP/planflow-codesigning-identities.log"
          runner_plist=""
          widget_plist=""
          umask 077
          if [[ -n "${DISTRIBUTION_CERTIFICATE_BASE64:-}" ]]; then
            echo "Certificate base64 secret present: yes"
          else
            echo "Certificate base64 secret present: no"
          fi
          if printf '%s' "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert"; then
            echo "Certificate base64 decode: success"
          else
            echo "::error title=BLOCKED_CERTIFICATE_DECODE::Distribution certificate decode failed."
            exit 1
          fi
          cert_size="$(stat -f%z "$cert")"
          cert_sha256="$(shasum -a 256 "$cert" | awk '{print $1}')"
          echo "Decoded certificate size (bytes): $cert_size"
          echo "Decoded certificate SHA-256: $cert_sha256"
          if [[ -n "${DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "Certificate password secret present: yes"
          else
            echo "Certificate password secret present: no"
          fi
          password_length="$(printf '%s' "$DISTRIBUTION_CERTIFICATE_PASSWORD" | wc -c | awk '{print $1}')"
          echo "Certificate password length: $password_length"
          printf '%s' "$RUNNER_PROFILE_BASE64" | base64 --decode > "$runner_profile"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$widget_profile"
          widget_profile_sha256="$(shasum -a 256 "$widget_profile" | awk '{print $1}')"
          echo "Decoded widget mobileprovision SHA-256: $widget_profile_sha256"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain" >/dev/null
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          if security import "$cert" -k "$keychain" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >"$import_log" 2>&1; then
            echo "security import result: success"
          else
            echo "security import result: failure"
            tail -n 20 "$import_log"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain" > "$identities_log"
          signing_identity_count="$(awk '/^[[:space:]]*[0-9]+\)/ {count++} END {print count+0}' "$identities_log")"
          echo "Signing identity exists: $([[ "$signing_identity_count" -gt 0 ]] && echo yes || echo no)"
          echo "Signing identity count: $signing_identity_count"
          security list-keychains -d user -s "$keychain" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          runner_plist="$RUNNER_TEMP/runner-profile.plist"
          widget_plist="$RUNNER_TEMP/widget-profile.plist"
          /usr/bin/security cms -D -i "$runner_profile" > "$runner_plist"
          /usr/bin/security cms -D -i "$widget_profile" > "$widget_plist"
          profile_team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$runner_plist")
          widget_team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$widget_plist")
          if [[ -z "$profile_team_id" || "$profile_team_id" != "$widget_team_id" ]]; then
            echo "::error title=BLOCKED_PROFILE_TEAM::Runner and Widget provisioning profiles do not share one TeamIdentifier."
            exit 1
          fi
          widget_app_groups="$(
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$widget_plist" 2>/dev/null || true
          )"
          if printf '%s\n' "$widget_app_groups" | grep -Eq '^[[:space:]]*group\.com\.fluxstudio\.planflow[[:space:]]*$'; then
            echo "Widget application-groups includes canonical group.com.fluxstudio.planflow: yes"
          else
            echo "::error title=BLOCKED_WIDGET_PROFILE_APP_GROUP::Widget provisioning profile missing canonical application group group.com.fluxstudio.planflow."
            exit 1
          fi
          if [[ -n "${APPLE_TEAM_ID:-}" && "$APPLE_TEAM_ID" != "$profile_team_id" ]]; then
            echo "::error title=BLOCKED_TEAM_MISMATCH::PLANFLOW_APPLE_TEAM_ID does not match the provisioning profile TeamIdentifier."
            exit 1
          fi
          APPLE_TEAM_ID="$profile_team_id"
          echo "APPLE_TEAM_ID=$profile_team_id" >> "$GITHUB_ENV"
          runner_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$runner_plist")
          widget_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_plist")
          cp "$runner_profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$runner_uuid.mobileprovision"
          cp "$widget_profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$widget_uuid.mobileprovision"
          {
            echo "PLANFLOW_RUNNER_PROFILE_UUID=$runner_uuid"
            echo "PLANFLOW_WIDGET_PROFILE_UUID=$widget_uuid"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/export-options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <!-- Explicit per-target mapping: Runner and WidgetKit never share a profile. -->
              <key>$IOS_BUNDLE_ID</key><string>$runner_uuid</string>
              <key>$IOS_WIDGET_BUNDLE_ID</key><string>$widget_uuid</string>
            </dict>
          </dict></plist>
          PLIST
          echo "Signing assets installed and export gate prepared (profile contents are not printed)."

      - name: Archive Runner with embedded WidgetKit extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/PlanFlow.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PLANFLOW_RUNNER_PROFILE_UUID="$PLANFLOW_RUNNER_PROFILE_UUID" \
            PLANFLOW_WIDGET_PROFILE_UUID="$PLANFLOW_WIDGET_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          test -d "$RUNNER_TEMP/PlanFlow.xcarchive/Products/Applications/Runner.app"
          test -d "$RUNNER_TEMP/PlanFlow.xcarchive/Products/Applications/Runner.app/PlugIns/PlanFlowWidgetExtension.appex" || {
            echo "::error::BLOCKED_WIDGET_ARCHIVE: Runner archive does not contain PlanFlowWidgetExtension.appex."
            exit 1
          }
          echo "Archive gates: Runner and embedded WidgetKit extension present."

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PlanFlow.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -exportPath "$RUNNER_TEMP/exported" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"
          ipa_candidates=()
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] && ipa_candidates+=("$candidate")
          done < <(find "$RUNNER_TEMP/exported" -maxdepth 1 -name '*.ipa' -type f | sort)
          if (( ${#ipa_candidates[@]} == 1 )); then
            ipa_path="${ipa_candidates[0]}"
            echo "Exported IPA filename: $(basename "$ipa_path")"
            echo "Exported IPA path: $ipa_path"
            echo "IPA gate: signed IPA exported."
            echo "PLANFLOW_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          elif (( ${#ipa_candidates[@]} == 0 )); then
            echo "::error title=BLOCKED_IPA_EXPORT::No .ipa file found under exported directory."
            exit 1
          else
            echo "::error title=BLOCKED_IPA_EXPORT::Multiple .ipa files found under exported directory."
            printf ' - %s\n' "${ipa_candidates[@]}"
            exit 1
          fi

      - name: Upload IPA to TestFlight with App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          api_key="$RUNNER_TEMP/asc-api-key.p8"
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$api_key"
          asc_key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$asc_key_dir"
          cp "$api_key" "$asc_key_dir/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$PLANFLOW_IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "TestFlight gate: upload accepted by App Store Connect."

      - name: Cleanup protected artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          rm -f ios/Runner/GoogleService-Info.plist
          rm -f "$RUNNER_TEMP"/planflow-distribution.p12 "$RUNNER_TEMP"/planflow-runner.mobileprovision "$RUNNER_TEMP"/planflow-widget.mobileprovision "$RUNNER_TEMP"/runner-profile.plist "$RUNNER_TEMP"/widget-profile.plist "$RUNNER_TEMP"/asc-api-key.p8 "$RUNNER_TEMP"/export-options.plist
          rm -f "$PLANFLOW_IPA_PATH"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID:-}.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PLANFLOW_RUNNER_PROFILE_UUID:-}.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${PLANFLOW_WIDGET_PROFILE_UUID:-}.mobileprovision"
          security delete-keychain "$RUNNER_TEMP/planflow-signing.keychain-db" >/dev/null 2>&1 || true
          echo "Secret cleanup gate executed."
