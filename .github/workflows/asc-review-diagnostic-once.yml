name: ASC unresolved review resubmit once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve rejected item and resubmit PlanFlow
        shell: bash
        run: |
          python3 - <<'PY'
          import argparse, importlib.util, json, sys, time, urllib.error, urllib.parse, urllib.request

          ROOT = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE = "com.fluxstudio.planflow"
          TARGET_VERSION = "1.0"
          TARGET_BUILD = "173"
          UNRESOLVED_SUBMISSION_ID = "6ae75024-7186-42da-8eef-3713c4884e50"
          EMPTY_READY_SUBMISSION_ID = "9eaa55ea-1512-4bc0-b95e-8d2264396e85"

          spec = importlib.util.spec_from_file_location("asc", "scripts/asc-next-build-number.py")
          asc = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(asc)
          ns = argparse.Namespace(key_id=None, issuer_id=None, private_key_path=None, private_key_base64=None)
          kid, issuer, pem = asc.resolve_credentials(ns)
          token = asc.make_token(pem, kid, issuer)

          def req(method, path, body=None, params=None, ok=(200, 201, 204)):
              url = ROOT + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode("utf-8")
              headers = {"Authorization": "Bearer " + token, "Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=45) as resp:
                      status = resp.status
                      raw = resp.read()
              except urllib.error.HTTPError as e:
                  status = e.code
                  raw = e.read()
              doc = {}
              if raw:
                  try:
                      doc = json.loads(raw)
                  except Exception:
                      doc = {"raw": raw.decode("utf-8", "replace")[:1000]}
              if status not in ok:
                  errors = (doc.get("errors") or [])[:5]
                  raise RuntimeError(f"ASC {method} {path} failed status={status} errors={json.dumps(errors, ensure_ascii=False)}")
              return status, doc

          def rel_id(resource, name):
              d = ((resource.get("relationships") or {}).get(name) or {}).get("data")
              return d.get("id") if isinstance(d, dict) else None

          # Fail closed on the exact app/version/build before touching review state.
          _, apps = req("GET", "/apps", params={"filter[bundleId]": BUNDLE, "limit": "10"})
          matches = apps.get("data") or []
          if len(matches) != 1:
              raise RuntimeError(f"Expected exactly one PlanFlow app, got {len(matches)}")
          app_id = matches[0]["id"]

          _, vd = req("GET", f"/apps/{app_id}/appStoreVersions", params={
              "filter[versionString]": TARGET_VERSION,
              "filter[platform]": "IOS",
              "fields[appStoreVersions]": "platform,versionString,appStoreState,appVersionState,build",
              "include": "build",
              "fields[builds]": "version,processingState",
              "limit": "50",
          })
          versions = vd.get("data") or []
          if len(versions) != 1:
              raise RuntimeError(f"Expected exactly one iOS version {TARGET_VERSION}, got {len(versions)}")
          version = versions[0]
          attrs = version.get("attributes") or {}
          version_state = attrs.get("appVersionState") or attrs.get("appStoreState")
          build_id = rel_id(version, "build")
          inc = {x.get("id"): x for x in vd.get("included") or []}
          selected_build = ((inc.get(build_id) or {}).get("attributes") or {}).get("version")
          if str(selected_build) != TARGET_BUILD:
              raise RuntimeError(f"Selected build mismatch: expected {TARGET_BUILD}, got {selected_build}")
          print(f"PRECHECK version={TARGET_VERSION} state={version_state} selectedBuild={selected_build}")

          _, sd = req("GET", f"/apps/{app_id}/reviewSubmissions", params={
              "fields[reviewSubmissions]": "platform,submittedDate,state,items",
              "include": "items",
              "fields[reviewSubmissionItems]": "state,appStoreVersion",
              "limit": "50",
              "limit[items]": "50",
          })
          submissions = {s.get("id"): s for s in (sd.get("data") or [])}
          included = {x.get("id"): x for x in (sd.get("included") or [])}

          unresolved = submissions.get(UNRESOLVED_SUBMISSION_ID)
          empty_ready = submissions.get(EMPTY_READY_SUBMISSION_ID)
          if not unresolved:
              raise RuntimeError("Expected unresolved submission is missing")
          unresolved_state = (unresolved.get("attributes") or {}).get("state")
          if unresolved_state not in {"UNRESOLVED_ISSUES", "WAITING_FOR_REVIEW", "IN_REVIEW"}:
              raise RuntimeError(f"Unexpected unresolved submission state: {unresolved_state}")

          if unresolved_state in {"WAITING_FOR_REVIEW", "IN_REVIEW"}:
              print(f"ALREADY_RESUBMITTED submissionState={unresolved_state} selectedBuild={TARGET_BUILD}")
              sys.exit(0)

          unresolved_links = (((unresolved.get("relationships") or {}).get("items") or {}).get("data") or [])
          unresolved_items = [included.get(x.get("id")) for x in unresolved_links if included.get(x.get("id"))]
          rejected = [i for i in unresolved_items if (i.get("attributes") or {}).get("state") == "REJECTED"]
          if len(rejected) != 1:
              raise RuntimeError(f"Expected exactly one rejected item, got {len(rejected)}")
          rejected_item_id = rejected[0]["id"]
          print(f"PRECHECK unresolvedSubmission={UNRESOLVED_SUBMISSION_ID} rejectedItem={rejected_item_id}")

          # Clean up the accidental empty READY_FOR_REVIEW submission created by the failed new-submission path.
          if empty_ready:
              empty_state = (empty_ready.get("attributes") or {}).get("state")
              empty_links = (((empty_ready.get("relationships") or {}).get("items") or {}).get("data") or [])
              if empty_state == "READY_FOR_REVIEW":
                  if empty_links:
                      raise RuntimeError("Refusing to cancel accidental submission because it unexpectedly contains items")
                  req("PATCH", f"/reviewSubmissions/{EMPTY_READY_SUBMISSION_ID}", {
                      "data": {
                          "type": "reviewSubmissions",
                          "id": EMPTY_READY_SUBMISSION_ID,
                          "attributes": {"canceled": True},
                      }
                  })
                  print("MUTATION accidentalEmptySubmissionCanceled=true")
              elif empty_state not in {"CANCELING", "COMPLETE"}:
                  raise RuntimeError(f"Unexpected accidental submission state: {empty_state}")

          # Mark the existing rejected item as resolved. This is Apple's resubmission path for UNRESOLVED_ISSUES.
          req("PATCH", f"/reviewSubmissionItems/{rejected_item_id}", {
              "data": {
                  "type": "reviewSubmissionItems",
                  "id": rejected_item_id,
                  "attributes": {"resolved": True},
              }
          })
          print("MUTATION rejectedItemResolved=true")

          # Poll until the item is ready for resubmission.
          item_state = None
          for _ in range(12):
              _, items_doc = req("GET", f"/reviewSubmissions/{UNRESOLVED_SUBMISSION_ID}/items", params={
                  "fields[reviewSubmissionItems]": "state,appStoreVersion",
                  "limit": "50",
              })
              items = items_doc.get("data") or []
              target = next((i for i in items if i.get("id") == rejected_item_id), None)
              item_state = ((target or {}).get("attributes") or {}).get("state")
              print(f"READBACK itemState={item_state}")
              if item_state == "READY_FOR_REVIEW":
                  break
              if item_state not in {"REJECTED", "READY_FOR_REVIEW"}:
                  raise RuntimeError(f"Unexpected item state after resolve: {item_state}")
              time.sleep(3)
          if item_state != "READY_FOR_REVIEW":
              raise RuntimeError(f"Rejected item did not become READY_FOR_REVIEW: {item_state}")

          # Resubmit the same UNRESOLVED_ISSUES submission.
          req("PATCH", f"/reviewSubmissions/{UNRESOLVED_SUBMISSION_ID}", {
              "data": {
                  "type": "reviewSubmissions",
                  "id": UNRESOLVED_SUBMISSION_ID,
                  "attributes": {"submitted": True},
              }
          })
          print("MUTATION unresolvedSubmissionSubmitted=true")

          # Authoritative final readback: old submission must be back in Apple's review queue and Build173 must remain selected.
          final_submission_state = None
          final_version_state = None
          final_build = None
          for _ in range(20):
              _, rd = req("GET", f"/reviewSubmissions/{UNRESOLVED_SUBMISSION_ID}", params={
                  "fields[reviewSubmissions]": "platform,submittedDate,state,items",
              })
              final_submission_state = ((rd.get("data") or {}).get("attributes") or {}).get("state")

              _, final_vd = req("GET", f"/appStoreVersions/{version['id']}", params={
                  "fields[appStoreVersions]": "platform,versionString,appStoreState,appVersionState,build",
                  "include": "build",
                  "fields[builds]": "version,processingState",
              })
              vr = final_vd.get("data") or {}
              va = vr.get("attributes") or {}
              final_version_state = va.get("appVersionState") or va.get("appStoreState")
              final_inc = {x.get("id"): x for x in (final_vd.get("included") or [])}
              final_build = ((final_inc.get(rel_id(vr, "build")) or {}).get("attributes") or {}).get("version")
              print(f"READBACK submissionState={final_submission_state} versionState={final_version_state} selectedBuild={final_build}")
              if final_submission_state in {"WAITING_FOR_REVIEW", "IN_REVIEW"}:
                  break
              time.sleep(4)

          if final_submission_state not in {"WAITING_FOR_REVIEW", "IN_REVIEW"}:
              raise RuntimeError(f"Resubmission did not enter review queue: {final_submission_state}")
          if str(final_build) != TARGET_BUILD:
              raise RuntimeError(f"Final selected build mismatch: {final_build}")
          print(f"SUCCESS submissionState={final_submission_state} versionState={final_version_state} selectedBuild={final_build}")
          PY
